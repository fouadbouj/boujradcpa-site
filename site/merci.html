<!DOCTYPE html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merci, votre message est envoyé.</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><style>/* VOICE a CPA firm's public site: confident, warm, precise
   IDEA a ledger in motion: rising columns, ruled lines, totals that land
   PICTURE full-screen night-green hero with animated rising columns and a rotating lowercase promise
   COLOUR night green #0d1a16 for hero and contact, white body, mint #b8f5d0 highlight, deep green #0d5c44 actions
   TYPE Space Grotesk 700 (lowercase display) + Inter
   LAYOUT hero full screen; services as rows; values grid; method line; clients; contact split */
:root{color-scheme:light;--bg:#fff;--ink:#111311;--mute:#4f5651;--night:#0d1a16;--mint:#b8f5d0;--deep:#0d5c44;--line:#e1e7e3;--soft:#f3f7f5}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.025em;line-height:1.02;margin:0}
h2{font-size:clamp(36px,5vw,66px);text-transform:lowercase}
h3{font-size:22px;line-height:1.2}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.band{padding-block:clamp(72px,9vw,136px)}
.soft{background:var(--soft)}
header{position:fixed;inset:0 0 auto;z-index:20;transition:background .35s,color .35s,box-shadow .35s;color:#fff}
header.solid{background:rgba(255,255,255,.96);color:var(--ink);box-shadow:0 1px 0 var(--line);backdrop-filter:blur(8px)}
.nav{display:flex;align-items:center;gap:22px;min-height:76px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:21px;margin-right:auto}
.brand svg{flex:none}
.links{display:flex;gap:26px}
.links a{text-decoration:none;font-size:15.5px;font-weight:500;opacity:.88;text-transform:lowercase;position:relative}
.links a::after{content:"";position:absolute;left:0;right:100%;bottom:-6px;height:2px;background:var(--deep);transition:right .3s}
header:not(.solid) .links a::after{background:var(--mint)}
.links a:hover::after{right:0}
.lang{font-size:14px;font-weight:600;text-decoration:none;border:1px solid currentColor;border-radius:999px;padding:5px 12px;opacity:.85}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:10px 22px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none;border:1.5px solid currentColor;background:transparent;color:inherit;cursor:pointer;font-family:inherit;transition:transform .25s,background .25s,color .25s}
.btn:hover{transform:translateY(-2px)}
.btn.mint{background:var(--mint);border-color:var(--mint);color:var(--night)}
header.solid .btn.mint{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.deep{background:var(--deep);border-color:var(--deep);color:#fff}
.btn .ar{transition:transform .25s}
.btn:hover .ar{transform:translateX(4px)}
:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.hero{background:var(--night);color:#fff;min-height:min(100svh,940px);position:relative;overflow:hidden;display:grid;align-items:end}
.hero .cols{position:absolute;left:0;right:0;bottom:0;height:78%;display:flex;align-items:flex-end;gap:clamp(6px,1.2vw,18px);padding:0 max(5vw,16px)}
.hero .cols i{flex:1;background:linear-gradient(#21423a,#142a23);border-top:2px solid #346656;transform-origin:bottom;animation:grow 1.6s cubic-bezier(.2,.7,.2,1) both}
.hero .cols i.hi{background:linear-gradient(var(--mint),#6fcf9b);border-top-color:#fff}
.hero .veil{position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,26,22,.92) 0%,rgba(13,26,22,.7) 45%,rgba(13,26,22,.15) 100%)}
.hero .in{position:relative;padding-bottom:clamp(64px,11vh,130px);padding-top:150px}
.hero .pre{font-family:"Space Grotesk",sans-serif;font-size:clamp(24px,2.8vw,38px);color:var(--mint);margin:0 0 4px}
.hero h1{font-size:clamp(44px,7.6vw,116px);text-transform:lowercase;min-height:2.08em;max-width:12ch}
.hero h1 span{display:inline-block;animation:swap .8s cubic-bezier(.2,.7,.2,1) both}
.hero .in>p:not(.pre){font-size:clamp(17px,1.5vw,20px);max-width:36em;color:#d3e0da;margin:22px 0 32px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.cue{position:absolute;right:max(5vw,16px);bottom:clamp(64px,11vh,130px);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#d3e0da}
.cue b{width:1.5px;height:56px;background:linear-gradient(var(--mint),transparent);animation:drip 1.8s infinite}
.mq{background:var(--mint);overflow:hidden;white-space:nowrap;border-block:1px solid #95e2b6}
.mq div{display:inline-flex;gap:46px;padding:20px 0;animation:mq 40s linear infinite;font-family:"Space Grotesk",sans-serif;font-size:clamp(20px,2.4vw,30px);font-weight:500;text-transform:lowercase}
.mq span::after{content:"\25CF";margin-left:46px;font-size:.45em;vertical-align:middle;color:var(--deep)}
.head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:end;margin-bottom:56px}
.head p{color:var(--mute);margin:0;font-size:18px}
.rows{border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.25fr) 40px;gap:24px;align-items:center;padding:26px 0;border-bottom:1px solid var(--line);position:relative;isolation:isolate}
.row::before{content:"";position:absolute;inset:0 -18px;background:var(--mint);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.7,.2,1);z-index:-1;border-radius:8px}
.row:hover::before{transform:scaleX(1)}
.row svg{width:36px;height:36px;fill:none;stroke:var(--deep);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row h3{font-size:clamp(22px,2.4vw,30px);text-transform:lowercase}
.row p{margin:0;color:var(--mute);font-size:16px}
.row .go{font-size:24px;transition:transform .3s;justify-self:end}
.row:hover .go{transform:translateX(4px) rotate(-45deg)}
.vals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.vals div{background:var(--soft);border-radius:18px;padding:30px 26px 34px;transition:transform .35s,background .35s,color .35s}
.vals div:hover{transform:translateY(-6px);background:var(--night);color:#fff}
.vals div:hover p{color:#d3e0da}
.vals h3{font-size:26px;text-transform:lowercase;margin-bottom:12px}
.vals p{margin:0;color:var(--mute);font-size:16px;transition:color .35s}
.vals .dot{display:block;width:14px;height:14px;border-radius:50%;background:var(--deep);margin-bottom:46px;box-shadow:0 0 0 6px #cfe9dc}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:0;right:0;top:27px;height:2px;background:#d3ddd7}
.steps::after{content:"";position:absolute;left:0;top:27px;height:2px;width:100%;background:var(--deep);transform:scaleX(0);transform-origin:left;transition:transform 1.8s cubic-bezier(.2,.7,.2,1)}
.steps.on::after{transform:scaleX(1)}
.steps li{list-style:none;position:relative}
.steps b{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--mint);font-family:"Space Grotesk",sans-serif;font-size:22px;margin-bottom:22px;position:relative;z-index:1}
.steps p{margin:8px 0 0;color:var(--mute)}
.cl{display:flex;flex-wrap:wrap;gap:12px;margin:0;padding:0}
.cl li{list-style:none;border:1.5px solid var(--ink);border-radius:999px;padding:12px 22px;font-family:"Space Grotesk",sans-serif;font-size:clamp(17px,1.8vw,22px);transition:background .25s,color .25s}
.cl li:hover{background:var(--ink);color:var(--mint)}
.contact{background:var(--night);color:#fff}
.ct{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(36px,6vw,90px);align-items:start}
.contact .lead{color:#d3e0da;margin:20px 0 0;font-size:18px}
.card{border-top:1px solid #2f4a40;padding-top:20px;margin-top:32px}
.card h3{color:var(--mint);font-size:18px;margin-bottom:10px;text-transform:lowercase}
.card address{font-style:normal;color:#e6efe9}
.maplink{color:var(--mint)}
.hours{width:100%;border-collapse:collapse;color:#e6efe9}
.hours td{padding:9px 0;border-bottom:1px solid #2f4a40}
.hours td:last-child{text-align:right;white-space:nowrap;font-weight:600}
form{background:#fff;color:var(--ink);border-radius:20px;padding:clamp(22px,3vw,38px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
form .full{grid-column:1/-1}
form h3{font-size:26px;text-transform:lowercase}
label{display:grid;gap:6px;font-size:14.5px;font-weight:600}
input,select,textarea{font:16px Inter,system-ui,sans-serif;padding:12px 14px;border:1.5px solid #c4d0c8;border-radius:10px;background:#fff;color:var(--ink);min-height:48px;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--deep);outline:none}
textarea{min-height:130px;resize:vertical}
form .note{font-size:13px;color:var(--mute);margin:0}
.hp{position:absolute;left:-9999px}
footer{background:#08110e;color:#cfdcd6}
footer .wrap{display:flex;flex-wrap:wrap;gap:24px 56px;justify-content:space-between;padding-block:44px;font-size:15px}
footer .brand{color:#fff}
.js .rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.js .rv.on{opacity:1;transform:none}
.thanks{min-height:100svh;display:grid;place-items:center;text-align:center;background:var(--night);color:#fff}
.thanks h1{font-size:clamp(36px,6vw,72px);text-transform:lowercase;margin-bottom:16px}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes swap{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
@media(max-width:1000px){.vals{grid-template-columns:repeat(2,minmax(0,1fr))}.row{grid-template-columns:44px minmax(0,1fr) 32px}.row p{grid-column:2/3}.row .go{grid-row:1;grid-column:3}}
@media(max-width:820px){.links{display:none}.head,.ct{grid-template-columns:1fr}.cue{display:none}.hero .veil{background:linear-gradient(180deg,rgba(13,26,22,.55),rgba(13,26,22,.9))}}
@media(max-width:600px){body{font-size:16px}.nav{gap:10px}.nav .btn{padding:8px 14px;min-height:40px;font-size:14px}.brand span{display:none}.vals{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.steps::before,.steps::after{display:none}form{grid-template-columns:1fr}.hero .cols{height:55%}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}

.brand .wm{display:block}.wdot{fill:var(--mint)}header.solid .wdot{fill:var(--deep)}
</style></head><body>
